# Ordering : Deployment + Service. Appelle Catalog directement (pas via la passerelle), par le
# nom du Service Kubernetes, à la place de la découverte de services d'Aspire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: { app: ordering }
  template:
    metadata:
      labels: { app: ordering }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ordering
          image: ecommerce-ordering:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: services__catalog__http__0
              value: http://catalog:8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /alive, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ordering
  namespace: ecommerce
spec:
  selector: { app: ordering }
  ports:
    - port: 8080
      targetPort: 8080
